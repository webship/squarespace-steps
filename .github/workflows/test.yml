name: Test

on:
  push:
    branches: [2.0.x]
  pull_request:
    branches: [2.0.x]

jobs:
  webship-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve demo site
        run: npx http-server demo-site -p 8080 -s &

      - name: Wait for demo site
        run: npx wait-on http://localhost:8080

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Run webship-js suite
        run: npm test
        env:
          LAUNCH_URL: http://localhost:8080
          HEADLESS: 'true'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: tests/reports/
          retention-days: 14
