<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo Studio &mdash; Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Get in touch with Demo Studio.">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script defer src="/assets/js/nav.js"></script>
  <script defer src="/assets/js/contact-form.js"></script>
</head>
<body>
  <header class="Header" data-nc-container="header">
    <a class="Header-branding-logo" href="/">Demo Studio</a>
    <nav aria-label="Main navigation">
      <ul class="Header-nav">
        <li class="Header-nav-item"><a href="/">Home</a></li>
        <li class="Header-nav-item"><a href="/shop.html">Shop</a></li>
        <li class="Header-nav-item"><a href="/about.html">About</a></li>
        <li class="Header-nav-item"><a href="/blog.html">Blog</a></li>
        <li class="Header-nav-item"><a href="/contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
    <button class="Header-toggle" aria-label="Open menu" aria-expanded="false">&#9776;</button>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero-title">Contact us</h1>
      <p class="hero-subtitle">We usually reply within a day or two.</p>
    </section>

    <form class="form-wrapper sqs-block-form" id="contact-form" data-form-id="contact">
      <div class="form-item">
        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" name="name" required>
      </div>
      <div class="form-item">
        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" name="email" required>
      </div>
      <div class="form-item">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="form-submit-button">Send message</button>
      <p class="form-submitted-message" role="status">Thanks &mdash; your message has been sent.</p>
    </form>
  </main>

  <footer class="Footer" data-nc-container="footer">
    <div class="Footer-block">
      <p class="Footer-block-title">Navigate</p>
      <ul class="Footer-nav">
        <li class="Footer-nav-item"><a href="/">Home</a></li>
        <li class="Footer-nav-item"><a href="/shop.html">Shop</a></li>
        <li class="Footer-nav-item"><a href="/about.html">About</a></li>
        <li class="Footer-nav-item"><a href="/blog.html">Blog</a></li>
        <li class="Footer-nav-item"><a href="/contact.html">Contact</a></li>
      </ul>
    </div>
    <div class="Footer-block">
      <p class="Footer-block-title">Follow</p>
      <ul class="Footer-nav">
        <li class="Footer-nav-item"><a href="https://instagram.com" rel="noopener">Instagram</a></li>
        <li class="Footer-nav-item"><a href="https://facebook.com" rel="noopener">Facebook</a></li>
      </ul>
    </div>
    <p class="Footer-copyright">&copy; 2026 Demo Studio. All rights reserved.</p>
  </footer>
</body>
</html>
